# 每日股票分析 - GitHub Actions Workflow
name: 每日股票分析

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行分析
        run: python main.py
        env:
          STOCK_USE_MOCK: 1
          PYTHONIOENCODING: utf-8

      - name: 提交报告
        run: |
          git config user.name "bot"
          git config user.email "bot@local"
          REPORT_DATE=$(date +'%Y%m%d')
          git add reports/daily_report_${REPORT_DATE}.txt
          git commit -m "每日报告 $(date +'%Y-%m-%d')" || echo "无新报告"
          git push

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成页面
        run: python scripts/build_pages.py

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
